[tool.poetry]
name = "matrix-loader"
description = "A sample project that demonstrating package management using pip and poetry"
version = "1.0.0"
package-mode = false
# means: do not treat project as python package
# or use: poetry install --no-root

[tool.poetry.dependencies]
python = "^3.10"
numpy = "^1.25"
pandas = "^2.1"
matplotlib = "^3.7"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

